[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dlm-deductive-logic-model"
version = "0.0.53"
description = "DLM v0.0053: the north-star BODY is integrated with the leveled final natural-language reading (N1..N9) -- it and the falsifier experiment share one pipeline (mnist.run.pipeline), so the body's own output carries the purpose/gist sentence, the certified 'why', and the closed-world absences, built over structure + acquired meaning + searched dataset_of + acquired api_effect. Plus Ground + Experience + open entity universe, the Form-tree IR, proof as data, kernel-certified label-free abstraction, core-concept (gist) capture, stratified closed-world negation (certified negatives, non-monotonic retraction), typed/moded signatures checked before any derivation, equality as a FINITE congruence (dlm.equality, D7a), the untrusted INTEGRATORS (dlm.integral, dlm.connection), and dlm.effective: an equal-budget held-out falsification of the integrators. Lisp is the symbolic medium, the kernel is the judge."
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "sailfish009"}]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["dlm*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["__pycache__", "dist", "build", ".git"]