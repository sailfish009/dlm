[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dlm-deductive-logic-model"
version = "0.0.8"
description = "DLM v0.0008: verifiable reading (grammar-as-data) and tiered, kernel-gated axiom acquisition on a function-free Horn core."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "sailfish009"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["dlm*"]
exclude = ["tests*", "artifacts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["artifacts", "__pycache__", "dist", "build", ".git"]