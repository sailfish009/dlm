[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dlm-deductive-logic-model"
version = "0.0.58"
description = "DLM v0.0058: THE IR-TREE IS THE ONE MEDIUM (dlm.irlearn) -- the medium through which the model improves its deduction and the medium Lisp reads/evaluates/writes are the SAME form tree. The model perceives its own dlm-package source as IR forms, induces the governing composition law AS a form, recursively reifies each certified extension as the next form predicate, and executes that same recursion through Lisp's own eval_form/findall -- so the learner's conclusion and the Lisp program's conclusion are one and the same tree, proven by exact round-trip (parse(dump(f))==f, atom_ir(ir_atom(f))==f) and by agreement (Lisp findall == the kernel's closure forms). Plus RECURSIVE SELF-SUPERVISED LEARNING ON ITS OWN SOURCE (dlm.selflearn): induce the composition law from examples it generated by walking its own call graph, then reify each certified extension until the reachability closure is recovered one composition cannot (0.31 -> 1.00 recall, zero false derivations), and grow its hypothesis vocabulary (a definitional conservative extension). Plus SELF-EVALUATION + WEAKNESS-TARGETED CURRICULUM (dlm.ability, dlm.curriculum), the model-as-subject automation (dlm.web, dlm.search, dlm.acquire, dlm.agent.Reader), the integrated north-star body (its final output IS the N1..N9 reading), Ground + Experience + open entity universe, the Form-tree IR, proof as data, kernel-certified label-free abstraction, core-concept (gist) capture, stratified closed-world negation, typed/moded signatures, equality as a FINITE congruence (dlm.equality, D7a), the untrusted INTEGRATORS (dlm.integral, dlm.connection), and dlm.effective. Lisp is the symbolic medium, the kernel is the judge."
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "sailfish009"}]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["dlm*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["__pycache__", "dist", "build", ".git"]