[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dlm-deductive-logic-model"
version = "0.0.65"
description = "IR-native deductive learner with typed IR-TREE, bounded TreeLisp control, Python lowering, and kernel-gated axiom revision."
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["dlm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
