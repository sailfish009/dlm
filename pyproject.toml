[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dlm-deductive-logic-model"
version = "0.0.57"
description = "DLM v0.0057: RECURSIVE SELF-SUPERVISED LEARNING ON THE MODEL'S OWN SOURCE (dlm.selflearn) -- the model perceives its own dlm-package call graph, INDUCES the governing composition law from examples it generated by walking its own edges, then feeds that law back through the kernel and reifies each certified extension as the next relation, recovering the reachability closure one composition cannot (0.31 -> 1.00 recall, zero false derivations on its own 325-node graph); it also grows its hypothesis vocabulary by reifying certified concepts, a definitional conservative extension reported separately. Plus SELF-EVALUATION + WEAKNESS-TARGETED CURRICULUM -- the model reads its own ability off the kernel closure (dlm.ability), finds the deduction target it cannot yet prove, acquires only the missing premise it lacks from the web, re-closes and stops on a named reason (dlm.curriculum); targets are discovered from the theory and improvement is scored at the target level, so a scrambled fact improves nothing. Plus RECURSIVE SELF-SUPERVISED LEARNING (dlm.recursive): each round closes its current relation under two definitional level rules (inherit + self-join) and reifies the certified extension as a new predicate, bootstrapping reachability to arbitrary depth in O(log diameter) rounds with no labels and the kernel as the only judge; a round that adds nothing is the fixpoint. Plus the model-as-subject automation (dlm.web, dlm.search, dlm.acquire, dlm.agent.Reader), the integrated north-star body (its final output IS the N1..N9 reading), Ground + Experience + open entity universe, the Form-tree IR, proof as data, kernel-certified label-free abstraction, core-concept (gist) capture, stratified closed-world negation, typed/moded signatures, equality as a FINITE congruence (dlm.equality, D7a), the untrusted INTEGRATORS (dlm.integral, dlm.connection), and dlm.effective. Lisp is the symbolic medium, the kernel is the judge."
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "sailfish009"}]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["dlm*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["__pycache__", "dist", "build", ".git"]