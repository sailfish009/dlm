[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dlm-deductive-logic-model"
version = "0.0.30"
description = "DLM v0.0030 (fused two-file core + untrusted IO/IR-SSL/self-supervised loop + grounded representation vector + bounded execution control + goal-conditioned control + Lisp seam + explanation/abstraction layer): a trusted substrate (dlm/__init__.py) plus one fused core (dlm/deductive.py) -- a weighted clause is at once a Horn rule (truth) and a weighted feature (order); Theory = rule set = feature set = model; only the kernel asserts. dlm/ssl.py self-supervises over an explicit intermediate representation whose canonical form is a plain symbol tree (a Form, the same type atoms/rules/theories serialise to); a frame is only a view of it. dlm/selfsup.py is the verifiable-reward self-supervised loop: propose a program (clauses = Lisp-like code), verify it with the kernel, and promote only programs that derive every positive and no negative -- with false_assert==0 as a hard gate. dlm/vector.py represents one IR tree as a sparse, grounded, exactly-invertible symbolic vector whose named coordinates (rel[0]=born, subj[0]=alan, ...) are the same symbols the reader/kernel already use. dlm/execute.py is a bounded, order-sensitive backward-chaining executor plus the experience-fed proof-credit loop: the learned order finally controls *execution* under a budget (not just a candidate list), the run leaves a readable trace, and every proved goal is re-checked against the kernel closure. dlm/control.py is the goal-conditioned control layer over that executor: each (goal, clause) pair is scored by a learned linear model over context features (a one-step fact-backed lookahead plus the clause/goal shape), so the same clause is tried first for the goal it can close and last for the one it cannot; it also carries an episodic memory of past (goal-signature, clause) successes. dlm/lisp.py is the Lisp seam: one unified evaluator over forms (facts/rules/clauses/theories/queries/macros), code-level pattern matching, quote/quasiquote and macros that write code, a source round-trip for a theory, proofs as re-readable and re-verifiable terms, and tree (IR) reification into facts -- so the S-expr substrate reads and writes itself while the kernel stays function-free. Every proposer/orderer only proposes/orders -- it never asserts. dlm/io.py is the heterogeneous-data boundary (text, datasets, image/audio/video metadata), rendering results back to natural language or structured output; the core stays unchanged. dlm/explain.py is the explanation / abstraction layer: an explicit description-length and review-budget accounting, proof-carrying hypotheses (a kernel-computed witness for every clause), named clause modules, exact kernel-checked compression (a clause is dropped only when the closure without it is unchanged -- behaviour-preserving on the given KB, not a claim about all models) and re-checkable explanations with counterfactuals; it is read-only over the core and never asserts."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "sailfish009"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["dlm*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["__pycache__", "dist", "build", ".git"]